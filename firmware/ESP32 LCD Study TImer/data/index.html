<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Study Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="page-header">
  <h1>📚 Study Tracker Dashboard</h1>
  <div class="header-right">
    <div id="lastUpdated" class="last-updated" aria-live="polite">Last updated: —</div>
  </div>
</header>

<div class="cards">
  <div class="card">
    <h2>Physics</h2>
    <p id="physics">00:00:00</p>
  </div>
  <div class="card">
    <h2>Chemistry</h2>
    <p id="chemistry">00:00:00</p>
  </div>
  <div class="card">
    <h2>Math</h2>
    <p id="math">00:00:00</p>
  </div>
  <div class="card total">
    <h2>PCM Total</h2>
    <p id="pcm_total">00:00:00</p>
  </div>
  <div class="card target">
    <h2>Today's Target</h2>
    <p id="targetDisplay">Not set</p>
    <div class="target-controls" id="targetControls">
      <button id="editTargetBtn">Edit</button>
    </div>
    <form id="targetForm" class="target-form" style="display:none" onsubmit="return false;" aria-hidden="true">
      <div class="inputs">
        <input id="targetHours" type="number" min="0" step="1" placeholder="Hours" aria-label="Target hours">
        <input id="targetMinutes" type="number" min="0" max="59" step="1" placeholder="Minutes" aria-label="Target minutes">
      </div>
      <div class="form-actions">
        <button id="saveTargetBtn" type="button" class="primary">Save</button>
        <button id="cancelTargetBtn" type="button">Cancel</button>
      </div>
      <div class="preset-row" aria-hidden="false">
        <button type="button" class="preset" data-mins="30">+30m</button>
        <button type="button" class="preset" data-mins="60">+1h</button>
        <button type="button" class="preset" data-mins="90">+1h30</button>
      </div>
    </form>
    <div class="progress" aria-hidden="true"><div id="targetProgress" class="progress-bar" style="width:0%"></div></div>
    <!-- Weekly average and weekly target -->
    <hr style="margin:12px 0; border:none; height:1px; background:rgba(255,255,255,0.04)">
    <h3 style="margin:8px 0 6px 0; font-size:0.95rem; color:var(--muted-2)">Weekly Average</h3>
    <p id="weeklyAvg" style="margin:4px 0 8px 0; font-weight:600">00:00:00</p>
    <div style="display:flex; gap:8px; justify-content:center; align-items:center;">
      <p id="weeklyTargetDisplay" style="margin:0; color:var(--muted-2);">Weekly target: Not set</p>
      <button id="editWeeklyTargetBtn">Edit</button>
    </div>
    <form id="weeklyTargetForm" class="target-form" style="display:none; margin-top:8px;" aria-hidden="true">
      <div class="inputs">
        <input id="weeklyTargetHours" type="number" min="0" step="1" placeholder="Hours" aria-label="Weekly target hours">
        <input id="weeklyTargetMinutes" type="number" min="0" max="59" step="1" placeholder="Minutes" aria-label="Weekly target minutes">
      </div>
      <div class="form-actions">
        <button id="saveWeeklyTargetBtn" type="button" class="primary">Save</button>
        <button id="cancelWeeklyTargetBtn" type="button">Cancel</button>
      </div>
      <div class="preset-row">
        <button type="button" class="preset-weekly" data-mins="60">+1h</button>
        <button type="button" class="preset-weekly" data-mins="120">+2h</button>
        <button type="button" class="preset-weekly" data-mins="300">+5h</button>
      </div>
    </form>
    <div class="progress" aria-hidden="true" style="margin-top:8px;"><div id="weeklyTargetProgress" class="progress-bar" style="width:0%"></div></div>
  </div>
  
  <!-- Monthly dropdown card -->
  <div class="card" style="min-width:200px">
    <h2>Monthly</h2>
    <label for="monthSelect" style="display:block; font-size:0.85rem; color:var(--muted-2); margin-bottom:8px">Select month</label>
    <select id="monthSelect" style="padding:8px; border-radius:8px; background:var(--glass-bg); color:var(--muted); border:none">
      <option value="">— Latest 15 days —</option>
    </select>
    <div style="margin-top:10px; text-align:center">
      <label for="avgWindowSelect" style="font-size:0.85rem; color:var(--muted-2); display:block; margin-bottom:6px">Average window</label>
      <div style="display:flex; gap:8px; align-items:center; justify-content:center">
        <select id="avgWindowSelect" style="padding:8px; border-radius:8px; background:var(--glass-bg); color:var(--muted); border:none">
          <option value="7">7 days</option>
          <option value="10">10 days</option>
          <option value="14">14 days</option>
          <option value="15">15 days</option>
          <option value="30" selected>30 days</option>
        </select>
        <div style="display:flex; gap:6px;">
          <button id="quick15" type="button" title="Last 15 days">15</button>
          <button id="quick30" type="button" title="Last 30 days">30</button>
        </div>
      </div>
    </div>
    <p id="monthlyAvgDisplay" style="margin-top:10px; font-weight:700">Avg/day: 00:00:00</p>
  </div>
</div>

<div class="buttons">
  <button onclick="logNow()">📤 Log Now</button>
  <button id="clearLogsBtn">⚠️ Clear All Logs</button>
  <a href="/logs.csv" download class="download-link"><button>📥 Download CSV</button></a>
  <input type="file" id="logsFile" accept=".csv" class="hidden-file">
  <label for="logsFile" class="file-btn">📂 Choose CSV</label>
  <button onclick="uploadLogs()">📤 Upload Logs CSV</button>
</div>

<h2>📄 Logs</h2>
<div class="table-container">
  <table id="logsTable">
    <tr>
      <th>Date & Time</th>
      <th>Physics</th>
      <th>Chemistry</th>
      <th>Math</th>
      <th>PCM Total</th>
    </tr>
  </table>
</div>

<script src="script.js"></script>
</body>
</html>
